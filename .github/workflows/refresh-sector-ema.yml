name: Refresh Sector Momentum (EMA grid)

# Recomputes the sector-momentum heatmap: % of Nifty 500 stocks per sector
# above their 4/20/30/40/52-week EMA. Universe from the NSE Nifty 500 list
# (bundled fallback in scripts/ingest/nifty500.csv); weekly closes from Yahoo
# Finance. No secrets. Runs Mon–Sat so Sunday's weekly wrap picks up a fresh grid.

on:
  schedule:
    - cron: "30 12 * * 1-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-sector-ema
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compute sector-momentum grid
        run: npm run ingest:sector-ema
      - name: Commit & push
        run: |
          if git diff --quiet -- src/data/sector-ema.json; then
            echo "No changes; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/sector-ema.json
          git commit -m "chore(data): refresh sector-momentum grid ($(date -u +%Y-%m-%d))"
          for i in 1 2 3 4 5; do
            if git push; then echo "pushed"; break; fi
            echo "push failed (attempt $i), rebasing"; git pull --rebase origin main; sleep $((2 ** i))
          done
