name: Refresh Corporate Actions

on:
  schedule:
    - cron: "45 14 * * 1-5"
  workflow_dispatch:
    inputs:
      debug:
        description: "Debug mode — print parsed structure, do not write/commit"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-corporate-actions
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ingest corporate actions
        env:
          SCREENER_USERNAME: ${{ secrets.SCREENER_USERNAME }}
          SCREENER_PASSWORD: ${{ secrets.SCREENER_PASSWORD }}
          DEBUG_SCRAPE: ${{ inputs.debug && '1' || '' }}
        run: npm run ingest:corporate-actions
      - name: Commit refreshed data
        if: ${{ !inputs.debug }}
        run: |
          git add src/data/corporate-actions.json
          git add src/data/history/corporate-actions/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No data changes; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): refresh corporate actions ($(date -u +%Y-%m-%d))"
          git push
