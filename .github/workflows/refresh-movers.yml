name: Refresh Movers

# 52-week highs / lows and volume gainers from NSE. Public data, no login.
# Runs after market close on weekdays.

on:
  schedule:
    - cron: "15 12 * * 1-5"
  workflow_dispatch:
    inputs:
      debug:
        description: "Debug mode — print parsed structure, do not write/commit"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-movers
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ingest movers
        env:
          DEBUG_SCRAPE: ${{ inputs.debug && '1' || '' }}
        run: npm run ingest:movers
      - name: Commit refreshed data
        if: ${{ !inputs.debug }}
        run: |
          git add src/data/movers.json
          git add src/data/history/movers/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No data changes; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): refresh movers ($(date -u +%Y-%m-%d))"
          pushed=""
          for i in 1 2 3 4 5; do
            if git push; then pushed=1; break; fi
            echo "push rejected; rebasing on latest main (attempt $i)..."
            git pull --rebase origin main || true
            sleep $((i * 2))
          done
          if [ -z "$pushed" ]; then echo "::error::failed to push after retries"; exit 1; fi
