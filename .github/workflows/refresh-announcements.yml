name: Refresh Announcements

on:
  schedule:
    # Mon–Fri at 14:00 UTC (~19:30 IST), after the Indian market close.
    - cron: "0 14 * * 1-5"
  workflow_dispatch:
    inputs:
      debug:
        description: "Debug mode — print parsed structure, do not write/commit"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-announcements
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Credentials come from repo secrets and are never printed by the script.
      # In debug mode the script only prints structure and writes nothing.
      - name: Ingest announcements
        env:
          SCREENER_USERNAME: ${{ secrets.SCREENER_USERNAME }}
          SCREENER_PASSWORD: ${{ secrets.SCREENER_PASSWORD }}
          DEBUG_SCRAPE: ${{ inputs.debug && '1' || '' }}
        run: npm run ingest:announcements

      - name: Commit refreshed data
        if: ${{ !inputs.debug }}
        run: |
          if git diff --quiet -- src/data/announcements.json; then
            echo "No data changes; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/announcements.json
          git commit -m "chore(data): refresh announcements ($(date -u +%Y-%m-%d))"
          git push
