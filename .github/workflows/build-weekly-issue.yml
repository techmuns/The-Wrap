name: Build Weekly Issue Draft

# Assembles a draft weekly Blog issue from the committed data feeds. Runs early
# Sunday, after the week's daily data refreshes have all landed. The draft is a
# starting point for review — a human writes the commentary and promotes it to
# src/content/issues/ to publish. No secrets needed: it only reads src/data/*.json.

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-weekly-issue
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate weekly draft
        run: npm run build:weekly-issue
      - name: Commit draft
        run: |
          if git diff --quiet -- src/content/drafts/; then
            echo "No draft changes; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/drafts/
          git commit -m "chore(blog): weekly issue draft ($(date -u +%Y-%m-%d))"
          git push
