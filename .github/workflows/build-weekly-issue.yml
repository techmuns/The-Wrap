name: Publish Weekly Wrap

# Assembles and PUBLISHES the weekly wrap from the committed data feeds. Runs
# early Sunday, after the week's daily data refreshes have all landed. Every line
# is composed automatically from independently-sourced, publicly-available data —
# no human step, no secrets (it only reads src/data/*.json).

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-weekly-issue
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate weekly wrap
        run: npm run build:weekly-issue
      - name: Commit & push
        run: |
          if git diff --quiet -- src/content/issues/; then
            echo "No wrap changes; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/issues/
          git commit -m "chore(blog): weekly wrap ($(date -u +%Y-%m-%d))"
          for i in 1 2 3 4 5; do
            if git push; then echo "pushed"; break; fi
            echo "push failed (attempt $i), rebasing"; git pull --rebase origin main; sleep $((2 ** i))
          done
