name: Refresh Market Indices

# Sector performance + market breadth from NSE's all-indices snapshot. Public
# data, no login. Runs after market close on weekdays.

on:
  schedule:
    - cron: "0 12 * * 1-5"
  workflow_dispatch:
    inputs:
      debug:
        description: "Debug mode — print parsed structure, do not write/commit"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-market-indices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ingest market indices
        env:
          DEBUG_SCRAPE: ${{ inputs.debug && '1' || '' }}
        run: npm run ingest:indices
      - name: Commit refreshed data
        if: ${{ !inputs.debug }}
        run: |
          git add src/data/indices.json
          git add src/data/history/market-indices/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No data changes; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): refresh market indices ($(date -u +%Y-%m-%d))"
          pushed=""
          for i in 1 2 3 4 5; do
            if git push; then pushed=1; break; fi
            echo "push rejected; rebasing on latest main (attempt $i)..."
            git pull --rebase origin main || true
            sleep $((i * 2))
          done
          if [ -z "$pushed" ]; then echo "::error::failed to push after retries"; exit 1; fi
